[package]
name = "music-organizer"
version = "0.2.0"
authors = ["Saecki <tobiasschmitz2001@gmail.com>"]
edition = "2021"

[lib]
name = "music_organizer"
path = "src/core/lib.rs"

[[bin]]
name = "music-organizer"
path = "src/cli/main.rs"

[profile.release]
codegen-units = 1
lto = true

[dependencies]
clap = { version = "4.5", features = ["wrap_help", "cargo"] }
clap_complete = "4.5"
indexmap = "2.7.1"
regex = "1.11.1"
id3 = "1.16.1"
mp4ameta = "0.11.0"
metaflac = "0.2.8"
shellexpand = "3.1.0"
crossbeam-channel = "0.5.14"
